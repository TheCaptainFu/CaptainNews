    <header id="main-header" class="bg-zinc-900/95 backdrop-blur-xl fixed top-[38px] w-full z-50 border-b border-zinc-800 h-[70px]">
        <nav class="gg-container flex items-center justify-between h-full">
            <div class="logo [&_img]:max-h-[50px]">
                <a href="/">
                    <img src="/icons/logo.png?v=2" alt="CaptainNews Logo">
                </a>
            </div>

            <button id="burger-btn" class="text-white hover:text-[#f2d06f] cursor-pointer focus:outline-none transition-colors p-2 z-[60]">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
        </nav>
    </header>
    <div id="news-ticker" class="fixed top-[0px] w-full z-[45] h-[38px] flex items-center bg-[#0a0f1e] border-b border-zinc-800/60">
        <div class="shrink-0 bg-[#3749bd] text-white font-condensed font-bold text-[11px] px-3 h-full flex items-center gap-2 uppercase tracking-widest">
            <span class="w-1.5 h-1.5 rounded-full bg-[#f2d06f] animate-pulse inline-block"></span>LIVE
        </div>
        <div class="flex-1 overflow-hidden h-full flex items-center">
            <div id="ticker-content" class="ticker-track flex items-center gap-0 whitespace-nowrap px-4">
                <span class="text-zinc-600 text-[11px] font-condensed">Φόρτωση...</span>
            </div>
        </div>
    </div>

    <div id="menu-overlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[55] opacity-0 pointer-events-none transition-opacity duration-300"></div>

    <div id="sidebar-menu" class="fixed top-0 right-0 h-full w-80 bg-zinc-900 shadow-2xl z-[60] transform translate-x-full transition-transform duration-300 ease-in-out">
        <div class="flex flex-col h-full">
            <div class="flex items-center justify-between p-6 border-b border-zinc-800">
                <h2 class="text-xl font-bold text-white font-condensed">ΜΕΝΟΥ</h2>
                <button id="close-sidebar" class="text-zinc-400 hover:text-white transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
{{SIDEBAR_NAV}}
            </nav>

            <div class="p-6 border-t border-zinc-800">
                <p class="text-zinc-500 text-xs font-condensed">⚓ CaptainNews.gr</p>
                <p class="text-zinc-600 text-xs mt-1">Ειδήσεις σε πραγματικό χρόνο</p>
            </div>
        </div>
    </div>

    <div id="category-bar" class="fixed top-[108px] w-full bg-[#111] z-40 border-b border-zinc-800 shadow-md h-[50px] flex items-center overflow-hidden">
        <div class="gg-container w-full overflow-x-auto" style="scrollbar-width:none; -ms-overflow-style:none;">
            <div id="category-filter" class="flex items-center gap-2 w-max min-w-full px-0">
{{FILTER_PILLS}}
            </div>
        </div>
    </div>
